name: Desktop app build

on:
  push:
    branches: [main]
    paths:
      - "Desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish standalone desktop app
        run: >
          dotnet publish Desktop/Lilly.ModManager.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: Lilly.ModManager-win-x64
          path: artifacts/Lilly.ModManager.exe
          if-no-files-found: error
